services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meetingagent
      POSTGRES_USER: meetingagent
      POSTGRES_PASSWORD: meetingagent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetingagent -d meetingagent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - meetingagent_pgdata:/var/lib/postgresql/data

volumes:
  meetingagent_pgdata:
